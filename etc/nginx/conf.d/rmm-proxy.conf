# /etc/nginx/conf.d/rmm-proxy.conf

# 1. limit_req_zone MUSS im http-Kontext stehen (außerhalb von server {})
limit_req_zone $http_x_tenant_id zone=rmm_tenant_limit:10m rate=10r/s;

server {
    listen 80; # bzw. 443 mit SSL-Zertifikat (empfohlen für Production/Webhooks)
    server_name vault.dein-msp.de;

    location /api/v1/webhook/ingest {
        limit_req zone=rmm_tenant_limit burst=20 nodelay;
        proxy_pass http://vault:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
